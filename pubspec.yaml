name: colophon
description: "Colophon - a book library for book lovers"
publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  archive: ^4.5.2
  file_picker: ^13.1.0
  http: ^1.6.0
  image: ^4.12.0
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  sqlite3: ^3.7.1
  unorm_dart: ^0.3.3
  uuid: ^4.6.0
  xml: ^7.1.0
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.4
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3
  crypto: ^3.0.7
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image_picker_platform_interface: ^2.11.2

flutter:
  uses-material-design: true
  generate: true
